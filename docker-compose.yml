services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/erp.db
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - backend_data:/data
    command: >
      sh -c "python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://backend:8000
    depends_on:
      - backend

volumes:
  backend_data:
