name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: backend pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run tests (SQLite — fast)
        working-directory: backend
        env:
          ENVIRONMENT: development
          DATABASE_URL: sqlite:///:memory:
          AUTO_CREATE_TABLES: "true"
          SCHEDULER_ENABLED: "false"
          RATE_LIMIT_ENABLED: "false"
          JWT_SECRET: test-secret-with-enough-length-for-prod-check-xx
        run: python -m pytest -q
      - name: Migration smoke (Postgres)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://erp:erp@localhost:5432/erp_test
          JWT_SECRET: test-secret-with-enough-length-for-prod-check-xx
        run: alembic upgrade head

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Build (production bundle)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: https://erp.example.com
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  docker-build:
    name: docker image build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: erp/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: erp/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE=https://erp.example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
